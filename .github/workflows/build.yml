name: Build PARS Plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FilmMakinesi/**"
      - "FilmizleHell/**"
      - "ShowTV/**"
      - "Tizam/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build plugins and plugins.json
        run: ./gradlew :FilmMakinesi:make :FilmizleHell:make :ShowTV:make :Tizam:make makePluginsJson --refresh-dependencies

      - name: Verify generated files
        run: |
          echo "=== GENERATED FILES ==="
          find . -type f \( -name "*.cs3" -o -name "plugins.json" \) -print

          test -f FilmMakinesi/build/FilmMakinesi.cs3
          test -f FilmizleHell/build/FilmizleHell.cs3
          test -f ShowTV/build/ShowTV.cs3
          test -f Tizam/build/Tizam.cs3
          test -f build/plugins.json

      - name: Prepare builds branch files
        run: |
          rm -rf /tmp/pars-builds
          mkdir -p /tmp/pars-builds

          cp FilmMakinesi/build/FilmMakinesi.cs3 /tmp/pars-builds/FilmMakinesi.cs3
          cp FilmizleHell/build/FilmizleHell.cs3 /tmp/pars-builds/FilmizleHell.cs3
          cp ShowTV/build/ShowTV.cs3 /tmp/pars-builds/ShowTV.cs3
          cp Tizam/build/Tizam.cs3 /tmp/pars-builds/Tizam.cs3
          cp build/plugins.json /tmp/pars-builds/plugins.json

          echo "=== PUBLISH CONTENT ==="
          ls -lah /tmp/pars-builds

      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan builds-publish
          git rm -rf . || true
          git clean -fdx

          cp -a /tmp/pars-builds/. .

          git add FilmMakinesi.cs3 FilmizleHell.cs3 ShowTV.cs3 Tizam.cs3 plugins.json
          git commit -m "Build plugins ${GITHUB_SHA::7}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:builds
